<div id="music-app">
    <div class="m-header">
        <div class="m-title-group">
            <div class="m-icon">🎹</div>
            <div class="m-info">
                <h2 class="m-h2">钢琴教学助手 Ultimate</h2>
                <span id="status-display" class="m-status">初始化中...</span>
            </div>
        </div>

        <div class="m-controls">
            <select id="song-select" class="m-select" onchange="MusicApp.loadSong(this.value)">
                <option value="" disabled selected>读取乐谱...</option>
            </select>

            <div class="m-btn-group">
                <button class="m-btn m-btn-primary" onclick="MusicApp.togglePlay()" id="btn-play">▶ 播放</button>
                <button class="m-btn m-btn-danger" onclick="MusicApp.stop()">⏹ 停止</button>
            </div>
            
            <div class="m-speed-group">
                <span class="m-label">倍速:</span>
                <button class="m-btn-pill" onclick="MusicApp.setSpeed(0.5, this)">0.5</button>
                <button class="m-btn-pill active" onclick="MusicApp.setSpeed(1.0, this)">1.0</button>
                <button class="m-btn-pill" onclick="MusicApp.setSpeed(1.5, this)">1.5</button>
            </div>
        </div>
    </div>

    <div class="m-sheet-wrapper" id="sheet-wrapper">
        <div class="m-notation-scroll" id="scroll-container">
            <div class="m-score-stage" id="score-stage">
                <div id="notation-paper"></div>
                <div id="cursor" class="m-cursor"><div class="m-cursor-head"></div></div>
                <div id="click-layer" class="m-click-layer"></div>
            </div>
        </div>

        <div id="empty-state" class="m-empty-state">
            🎵 请在上方选择乐谱开始练习
        </div>
    </div>

    <div class="m-piano-container">
        <div class="m-piano-bar">
            <span class="m-hint">💡 操作：拖动红线或点击乐谱可跳转 | Shift+滚轮横向看琴</span>
            <button class="m-btn-small" onclick="MusicApp.scrollToCenter()">🎯 回到中央 C</button>
        </div>
        
        <div class="m-piano-scroll-view" id="piano-scroll">
            <div id="piano-keyboard" class="m-piano-body"></div>
        </div>
    </div>
</div>

<style>
    /* === 布局与基础 === */
    #music-app { width: 100%; font-family: 'Segoe UI', sans-serif; color: #333; display: flex; flex-direction: column; gap: 15px; }
    #music-app * { box-sizing: border-box; user-select: none; }

    /* 顶部栏 */
    .m-header { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .m-title-group { display: flex; align-items: center; gap: 10px; }
    .m-icon { font-size: 24px; background: #e3f2fd; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .m-h2 { margin: 0; font-size: 18px; font-weight: 700; color: #2c3e50; }
    .m-status { font-size: 11px; color: #7f8c8d; }
    
    .m-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .m-select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; height: 32px; }
    
    .m-btn { border: none; padding: 0 15px; height: 32px; border-radius: 4px; color: white; cursor: pointer; font-weight: 600; font-size: 13px; }
    .m-btn-primary { background-color: #3498db; } .m-btn-primary:hover { background-color: #2980b9; }
    .m-btn-danger { background-color: #e74c3c; }
    
    .m-speed-group { display: flex; align-items: center; gap: 2px; background: #f5f6fa; padding: 3px; border-radius: 20px; }
    .m-label { font-size: 11px; color: #999; margin: 0 5px; }
    .m-btn-pill { border: none; background: none; color: #666; font-size: 11px; padding: 4px 8px; border-radius: 12px; cursor: pointer; }
    .m-btn-pill.active { background: #3498db; color: white; }

    /* === 乐谱区域 (核心) === */
    .m-sheet-wrapper {
        background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; 
        min-height: 250px; position: relative; overflow: hidden; /* 隐藏溢出 */
    }

    .m-notation-scroll {
        position: relative;
        overflow-x: auto;
        padding: 20px;
        min-height: 250px;
    }
    .m-score-stage { position: relative; width: max-content; margin: 0 auto; }
    #notation-paper svg { overflow: visible; }

    /* ✨ 魔法红线 */
    .m-cursor {
        position: absolute;
        top: 0; left: 0;
        width: 26px; /* 半透明播放带宽度 */
        height: 36px; /* 会在运行时更新为行高 */
        background: linear-gradient(90deg, rgba(231,76,60,0.06), rgba(231,76,60,0.12));
        border-radius: 4px;
        z-index: 200;
        display: none;
        pointer-events: auto;
        cursor: ew-resize;
        transition: left 0.04s linear, top 0.08s linear, height 0.12s linear;
        box-shadow: 0 6px 14px rgba(0,0,0,0.06);
        overflow: visible;
    }
    .m-cursor::before { content: ''; position: absolute; left: 50%; transform: translateX(-50%); top: 0; bottom: 0; width: 2px; background: rgba(231,76,60,0.95); border-radius:2px; }
    .m-cursor-head { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; background: rgba(231,76,60,0.95); border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
    .m-cursor:hover { box-shadow: 0 8px 18px rgba(231,76,60,0.12); }

    .m-click-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 180; cursor: pointer;
        display: block; /* 保持可点击以支持试听 */
    }

    .m-empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #bdc3c7; }

    /* === 钢琴区域 === */
    .m-piano-container { background: #2d3436; border-radius: 8px; padding: 10px 0; width: 100%; overflow: hidden; }
    .m-piano-bar { padding: 0 20px 8px 20px; display: flex; justify-content: space-between; color: #b2bec3; font-size: 11px; align-items: center; }
    .m-btn-small { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
    .m-piano-scroll-view { width: 100%; overflow-x: auto; padding-bottom: 5px; scrollbar-width: thin; scrollbar-color: #636e72 #2d3436; }
    .m-piano-body { position: relative; height: 140px; width: 2288px; margin: 0 auto; background: #111; }
    
    .m-key { position: absolute; top: 0; height: 100%; border-radius: 0 0 4px 4px; cursor: pointer; transition: transform 0.05s, background 0.05s; }
    .m-key-white { width: 26px; height: 140px; background: #fff; border: 1px solid #999; z-index: 1; }
    .m-key-white.active { background: #dfe6e9; transform: translateY(2px); border-bottom: 4px solid #b2bec3; }
    .m-key-black { width: 16px; height: 85px; background: #111; border: 1px solid #000; z-index: 2; }
    .m-key-black.active { background: #333; transform: translateY(2px); box-shadow: inset 0 0 5px #555; }
    .m-key[data-note="C4"]::after { content: "C4"; position: absolute; bottom: 5px; width: 100%; text-align: center; color: #999; font-size: 9px; }
</style>

<script>
(function(){
    const MusicApp = {
        songs: [],
        synth: null,
        visualObj: null,
        timer: null,
        cursorEl: null,
        audioContext: null,
        
        // 状态变量
        isPlaying: false,
        currentSpeed: 1.0,
        isDragging: false,
        noteElements: [], // 存储所有音符的位置信息，用于计算拖拽

        init: function() {
            this.cursorEl = document.getElementById('cursor');
            this.renderFullPiano();
            this.fetchData();
            
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            this.audioContext = new AudioCtor();

            // 使用本地 WebAudio 音色实现，自行管理合成器，不再依赖 ABCJS.CreateSynth
            this.synth = null;

            // 初始化拖拽监听
            this.initDragLogic();
        },
        

        fetchData: function() {
            const sel = document.getElementById('song-select');
            fetch('data/songs.json')
                .then(r => r.json())
                .then(data => {
                    this.songs = data;
                    sel.innerHTML = '<option value="" disabled selected>请选择乐谱...</option>';
                    data.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id; opt.innerText = s.title; sel.appendChild(opt);
                    });
                })
                .catch(() => sel.innerHTML = '<option>⚠️ JSON加载失败</option>');
        },

        loadSong: function(id) {
            this.stop();
            document.getElementById('empty-state').style.display = 'none';
            const song = this.songs.find(s => s.id == id);
            
            // 渲染乐谱，开启 clickListener
            // 这对实现“点击跳转”至关重要
            this.visualObj = ABCJS.renderAbc("notation-paper", song.abc, {
                responsive: "resize",
                scale: 1.1,
                add_classes: true,
                paddingtop: 0, paddingbottom: 0, paddingleft: 0, paddingright: 0,
                // 监听乐谱点击
                clickListener: (abcElem, tuneNumber, classes, analysis, drag, mouseEvent) => {
                     this.handleScoreClick(abcElem);
                }
            })[0];

            // 缓存所有音符位置，用于拖拽吸附
            this.cacheNotePositions();

            // 不再使用 ABCJS 的 synth，播放由模块内 WebAudio 接管
        },

        // === 2. 拖拽与跳转逻辑 (核心新功能) ===
        
        // 当用户直接点击乐谱上的音符时
        handleScoreClick: function(abcElem) {
            // 如果点击了音符，我们尝试从这里开始播放
            // 注意：ABCJS Basic Synth 不支持直接 seek 到时间点
            // 我们必须做一个 hack：用 setTiming 或者重新 render 只有后半段的谱子(太复杂)
            // 妥协方案：点击音符，移动红线过去，并高亮该音符，告诉用户“从这里开始”需要某种高级支持
            
            // 实际上，为了满足你的需求，我们让红线跳过去
            // 并尝试用 "Note Highlight" 
            if(abcElem && abcElem.abselem) {
                this.moveCursorTo(abcElem.abselem.x, abcElem.abselem.y, abcElem.abselem.height);
                
                // 停止当前播放
                if(this.isPlaying) this.stop();
                
                // 播放点击的那个音
                if(abcElem.midiPitches) {
                    abcElem.midiPitches.forEach(p => this.playPianoVoice(p.pitch));
                }
                
                // ⚠️ 真实情况：ABCJS Basic版不支持 seek()
                // 如果你想真的“从这里开始自动播放”，需要非常复杂的代码切分 ABC 字符串
                // 这里我们做到：红线跳过去，发声，就绪。
            }
        },

        initDragLogic: function() {
            const cursor = this.cursorEl;
            const container = document.getElementById('scroll-container');
            let isDown = false;

            cursor.addEventListener('mousedown', (e) => {
                isDown = true;
                cursor.style.transition = 'none'; // 拖动时取消平滑过渡，实时跟随
                cursor.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                // 计算鼠标在容器内的相对 X 坐标
                const rect = container.getBoundingClientRect();
                let x = e.clientX - rect.left + container.scrollLeft;
                
                // 限制边界
                if(x < 0) x = 0;
                
                cursor.style.left = x + 'px';
            });

            document.addEventListener('mouseup', (e) => {
                if (!isDown) return;
                isDown = false;
                cursor.style.cursor = 'ew-resize';
                cursor.style.transition = 'left 0.1s linear'; // 恢复平滑
                
                // 拖拽结束：寻找最近的音符
                this.snapToNearestNote();
            });
        },

        cacheNotePositions: function() {
            // 从 SVG 中获取所有音符元素的位置
            // abcjs 生成的音符都有 class "abcjs-note"
            const notes = document.querySelectorAll('.abcjs-note');
            this.noteElements = [];
            
            // 获取容器与 notation 的偏移，以便计算相对坐标
            const container = document.getElementById('scroll-container');
            const containerRect = container.getBoundingClientRect();
            const notationRect = document.getElementById('notation-paper').getBoundingClientRect();

            notes.forEach(note => {
                const rect = note.getBoundingClientRect();
                // 计算相对滚动容器的 x 坐标（与 cursor 计算保持一致）
                const x = rect.left - containerRect.left - (notationRect.left - containerRect.left) + notationRect.left - notationRect.left + container.scrollLeft;
                // 上面的复杂计算最终等价于 rect.left - notationRect.left + container.scrollLeft
                this.noteElements.push({
                    x: rect.left - notationRect.left + container.scrollLeft,
                    el: note,
                });
            });
            // 按 x 排序
            this.noteElements.sort((a, b) => a.x - b.x);
        },

        // 将 ABCJS 事件坐标转换为舞台（score-stage）坐标并返回可用度量
        getScoreStageMetrics: function() {
            const stage = document.getElementById('score-stage');
            const notation = document.getElementById('notation-paper');
            const container = document.getElementById('scroll-container');
            const stageRect = stage.getBoundingClientRect();
            const notationRect = notation.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            return { stage, notation, container, stageRect, notationRect, containerRect };
        },

        // 根据 TimingCallbacks 提供的 ev（或 beat-like 对象）定位播放带
        setPlayheadFromTimingPosition: function(ev) {
            if (!ev || (ev.left == null && ev.top == null)) return;
            const m = this.getScoreStageMetrics();
            // 事件中心 x
            const evLeft = (typeof ev.left === 'number') ? ev.left : 0;
            const evWidth = (typeof ev.width === 'number') ? ev.width : (ev.w || 0);
            const worldX = m.notationRect.left + evLeft + (evWidth / 2);
            const stageX = worldX - m.stageRect.left;

            const evTop = (typeof ev.top === 'number') ? ev.top : 0;
            const evHeight = (typeof ev.height === 'number') ? ev.height : (ev.h || 36);
            const worldY = m.notationRect.top + evTop;
            const stageY = worldY - m.stageRect.top;

            // 更新播放带位置与高度
            this.cursorEl.style.display = 'block';
            this.cursorEl.style.left = Math.round(stageX) + 'px';
            this.cursorEl.style.top = Math.round(stageY) + 'px';
            this.cursorEl.style.height = Math.max(24, Math.round(evHeight)) + 'px';
        },

        snapToNearestNote: function() {
            // 获取当前红线位置
            const cursorX = parseFloat(this.cursorEl.style.left || '0');
            
            // 寻找最近的音符
            let closest = null;
            let minDist = Infinity;
            
            this.noteElements.forEach(note => {
                const dist = Math.abs(note.x - cursorX);
                if(dist < minDist) {
                    minDist = dist;
                    closest = note;
                }
            });

            if(closest) {
                // 吸附过去
                this.cursorEl.style.left = (closest.x - 5) + 'px'; // -5 是为了对准左侧
                
                // 停止播放，准备重新开始
                this.stop();
                
                // 可以在这里触发 "从第 N 个音符播放" 的逻辑
                // 但由于库限制，我们暂时只做视觉吸附和试听
                // 模拟点击该音符的效果（如果有对应数据）
                console.log("Snapped to note at x:", closest.x);
            }
        },

        moveCursorTo: function(x, y, h) {
            this.cursorEl.style.display = 'block';
            this.cursorEl.style.left = x + 'px';
            // 红线贯穿，不需要设置 y 和 h，高度由 CSS 100% 控制
        },

        // === 3. 播放与同步逻辑 ===
        togglePlay: function() {
            if (this.isPlaying) this.stop();
            else this.play();
        },

        play: function() {
            if (!this.visualObj) return alert("请先选择乐谱");
            if (this.audioContext.state === 'suspended') this.audioContext.resume();

            // 使用本模块的 TimingCallbacks + WebAudio 播放器实现播放与同步
            this.isPlaying = true;
            document.getElementById('btn-play').innerText = "⏸ 暂停";

            this.timer = new ABCJS.TimingCallbacks(this.visualObj, {
                beatCallback: (beat) => {
                    // 有些版本会通过 beat 提供 left/top，支持平滑插值
                    if (beat && beat.left != null) {
                        this.setPlayheadFromTimingPosition(beat);
                    }
                },
                eventCallback: (ev) => {
                    if (ev) {
                        this.setPlayheadFromTimingPosition(ev);

                        if (ev.midiPitches) {
                            ev.midiPitches.forEach(p => {
                                this.flashKey(p.pitch, Math.max(80, 300 / this.currentSpeed));
                                const dur = (ev.duration && typeof ev.duration === 'number') ? (ev.duration / 1000) / this.currentSpeed : Math.max(0.12, 0.35 / this.currentSpeed);
                                this.playPianoVoice(p.pitch, dur, 0.9);
                            });
                        }
                    } else {
                        this.stop();
                    }
                },
                lineEndCallback: () => {
                    // 当行结束或到达标志时，平滑滚动以将光带保持在视口中间
                    const container = document.getElementById('scroll-container');
                    const center = container.clientWidth / 2;
                    const target = Math.max(0, this.cursorEl.offsetLeft - center);
                    container.scrollTo({ left: target, behavior: 'smooth' });
                }
            });

            this.timer.start();
        },

        stop: function() {
            if (this.timer) { try { this.timer.stop(); } catch(e){} this.timer = null; }
            this.isPlaying = false;
            document.getElementById('btn-play').innerText = "▶ 播放";
            // 停止时不隐藏光标，方便用户看位置，也不归零
            this.clearKeys();
        },

        setSpeed: function(speed, btn) {
            this.currentSpeed = speed;
            document.querySelectorAll('.m-btn-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (this.isPlaying) { this.stop(); this.play(); }
        },

        // === 钢琴渲染与发音 ===
        renderFullPiano: function() {
            const el = document.getElementById('piano-keyboard');
            let html = '';
            let whiteIndex = 0;
            const whiteW = 26; 
            for (let i = 21; i <= 108; i++) {
                const note = this.getNote(i);
                const isBlack = note.includes('#');
                if (!isBlack) {
                    html += `<div class="m-key m-key-white" id="k-${i}" data-midi="${i}" style="left:${whiteIndex * whiteW}px" data-note="${note}"></div>`;
                    whiteIndex++;
                } else {
                    const left = (whiteIndex - 1) * whiteW + (whiteW * 0.6);
                    html += `<div class="m-key m-key-black" id="k-${i}" data-midi="${i}" style="left:${left}px"></div>`;
                }
            }
            el.style.width = (whiteIndex * whiteW) + "px";
            el.innerHTML = html;
            el.addEventListener('mousedown', (e) => {
                const k = e.target;
                if (!k.classList.contains('m-key')) return;
                const midi = parseInt(k.dataset.midi);
                this.flashKey(midi, 500);
                this.playPianoVoice(midi); 
            });
            setTimeout(() => this.scrollToCenter(), 500);
        },

        scrollToCenter: function() { document.getElementById('piano-scroll').scrollTo({ left: 600, behavior: 'smooth' }); },
        getNote: function(midi) { const n = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; return n[midi % 12] + (Math.floor(midi/12)-1); },
        flashKey: function(midi, time) {
            const k = document.getElementById(`k-${midi}`);
            if (!k) return;
            k.classList.remove('active'); void k.offsetWidth; k.classList.add('active');
            setTimeout(() => k.classList.remove('active'), time);
        },
        clearKeys: function() { document.querySelectorAll('.m-key.active').forEach(k => k.classList.remove('active')); },

        // 自制钢琴音色：ADSR 包络 + 简易混响/延迟
        playPianoVoice: function(midi, duration, velocity) {
            duration = typeof duration === 'number' ? duration : 1.2;
            velocity = typeof velocity === 'number' ? velocity : 1.0;
            if (this.audioContext.state === 'suspended') this.audioContext.resume();
            const ctx = this.audioContext;
            const now = ctx.currentTime;
            const freq = 440 * Math.pow(2, (midi - 69) / 12);

            // 主音与泛音
            const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = freq;
            const overtone = ctx.createOscillator(); overtone.type = 'sine'; overtone.frequency.value = freq * 2.0;

            // 椎体滤波与输出增益
            const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = Math.max(2000, freq * 6);
            const gainNode = ctx.createGain();

            // 简易混响/延迟（轻量）
            const delay = ctx.createDelay(0.5); delay.delayTime.value = 0.08;
            const feedback = ctx.createGain(); feedback.gain.value = 0.18;

            // 连接链路
            osc.connect(filter); overtone.connect(filter);
            filter.connect(gainNode);

            // 并行送入延迟（混合干/湿）
            const delayGain = ctx.createGain(); delayGain.gain.value = 0.4;
            gainNode.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(delayGain);
            delayGain.connect(ctx.destination);

            gainNode.connect(ctx.destination);

            // ADSR
            const attack = Math.max(0.005, Math.min(0.06, duration * 0.03));
            const decay = Math.min(0.12, duration * 0.08);
            const sustainLevel = 0.5;
            const release = Math.min(1.2, duration * 0.8);

            gainNode.gain.setValueAtTime(0.0001, now);
            gainNode.gain.linearRampToValueAtTime(velocity * 0.8, now + attack);
            gainNode.gain.linearRampToValueAtTime(velocity * sustainLevel, now + attack + decay);

            osc.start(now); overtone.start(now);

            // 释放曲线
            gainNode.gain.setValueAtTime(velocity * sustainLevel, now + duration - release);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration + 0.02);

            osc.stop(now + duration + 0.05);
            overtone.stop(now + duration + 0.05);
        }
    };

    window.MusicApp = MusicApp;
    MusicApp.init();
})();
</script>
